<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automato — relatório do projeto</title>
    <style>
        :root { color-scheme: light dark; --fg: #1d1d1f; --bg: #ffffff; --muted: #f4f4f6; --line: #d6d6db; --accent: #6b8e23; }
        @media (prefers-color-scheme: dark) {
            :root { --fg: #e6e6e9; --bg: #17171a; --muted: #232328; --line: #3a3a42; --accent: #9acd32; }
        }
        body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, sans-serif; }
        main { max-width: 900px; margin: 0 auto; padding: 32px 16px 80px; }
        h1, h2, h3 { line-height: 1.25; }
        h2 { margin-top: 2.2em; padding-bottom: 0.3em; border-bottom: 2px solid var(--accent); }
        h3 { margin-top: 1.8em; }
        a { color: var(--accent); }
        hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
        blockquote { margin: 1em 0; padding: 0.5em 1em; border-left: 4px solid var(--accent); background: var(--muted); }
        code { font: 0.9em ui-monospace, monospace; background: var(--muted); padding: 0.1em 0.3em; border-radius: 4px; }
        pre { background: var(--muted); padding: 12px 14px; border-radius: 6px; overflow-x: auto; }
        pre code { background: none; padding: 0; }
        table { border-collapse: collapse; margin: 1em 0; display: block; overflow-x: auto; font-size: 0.92em; }
        th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
        th { background: var(--muted); }
        .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
    </style>
  <script type="module" crossorigin src="./assets/report-BmaekpDo.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="./assets/report-0H9Va7rb.css">
</head>
<body>
    <main id="report"></main>
</body>
</html>
